<!-- @dsCard group="Status &amp; Kanäle" height=300 width=1400 -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>StatusBadge</title>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="pv">
<div class="pv-col"><span class="t-label">Die sieben Status in Reihenfolge</span><div class="pv-row" style="gap:6px;align-items:flex-start"><div class="pv-col" style="align-items:flex-start"><span class="pv-lbl">1</span><span class="tw-status tw-status--idea "><i data-lucide="lightbulb"></i>Idee</span></div><span style="color:var(--color-text-muted);padding-top:20px"><i data-lucide="chevron-right" class="tw-ic-sm"></i></span><div class="pv-col" style="align-items:flex-start"><span class="pv-lbl">2</span><span class="tw-status tw-status--draft "><i data-lucide="pencil-line"></i>Entwurf</span></div><span style="color:var(--color-text-muted);padding-top:20px"><i data-lucide="chevron-right" class="tw-ic-sm"></i></span><div class="pv-col" style="align-items:flex-start"><span class="pv-lbl">3</span><span class="tw-status tw-status--review "><i data-lucide="hourglass"></i>Zur Freigabe</span></div><span style="color:var(--color-text-muted);padding-top:20px"><i data-lucide="chevron-right" class="tw-ic-sm"></i></span><div class="pv-col" style="align-items:flex-start"><span class="pv-lbl">4</span><span class="tw-status tw-status--approved "><i data-lucide="circle-check"></i>Freigegeben</span></div><span style="color:var(--color-text-muted);padding-top:20px"><i data-lucide="chevron-right" class="tw-ic-sm"></i></span><div class="pv-col" style="align-items:flex-start"><span class="pv-lbl">5</span><span class="tw-status tw-status--scheduled "><i data-lucide="calendar-clock"></i>Geplant</span></div><span style="color:var(--color-text-muted);padding-top:20px"><i data-lucide="chevron-right" class="tw-ic-sm"></i></span><div class="pv-col" style="align-items:flex-start"><span class="pv-lbl">6</span><span class="tw-status tw-status--published "><i data-lucide="send"></i>Veröffentlicht</span></div><span style="color:var(--color-text-muted);padding-top:20px"><i data-lucide="chevron-right" class="tw-ic-sm"></i></span><div class="pv-col" style="align-items:flex-start"><span class="pv-lbl">7</span><span class="tw-status tw-status--analyzed "><i data-lucide="chart-column"></i>Ausgewertet</span></div></div></div>
<div class="pv-row"><div class="pv-col"><span class="pv-lbl">Kompakt (nur Farbe + Icon, z. B. in Tabellen)</span><div class="pv-row" style="gap:16px"><span class="tw-status tw-status--idea tw-status--dot"><i data-lucide="lightbulb"></i>Idee</span><span class="tw-status tw-status--draft tw-status--dot"><i data-lucide="pencil-line"></i>Entwurf</span><span class="tw-status tw-status--review tw-status--dot"><i data-lucide="hourglass"></i>Zur Freigabe</span><span class="tw-status tw-status--approved tw-status--dot"><i data-lucide="circle-check"></i>Freigegeben</span><span class="tw-status tw-status--scheduled tw-status--dot"><i data-lucide="calendar-clock"></i>Geplant</span><span class="tw-status tw-status--published tw-status--dot"><i data-lucide="send"></i>Veröffentlicht</span><span class="tw-status tw-status--analyzed tw-status--dot"><i data-lucide="chart-column"></i>Ausgewertet</span></div></div></div>
<div class="pv-row"><div class="pv-col"><span class="pv-lbl">Fortschritt im Editor</span><div class="pv-col" style="width:280px"><div class="tw-steps"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><span class="t-small t-muted">Schritt 4 von 7 · Freigegeben</span></div></div><div class="pv-col"><span class="pv-lbl">Laden</span><span class="tw-status is-loading tw-skel">&nbsp;</span></div></div>
</div>
<script>window.lucide && lucide.createIcons();</script>
</body>
</html>
