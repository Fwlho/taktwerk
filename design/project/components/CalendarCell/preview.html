cell is-drop" style="width:168px"><span class="tw-cell__date">18</span><div class="tw-entry " title="Freigegeben"><span class="tw-mono tw-mono--offline tw-mono--sm" aria-hidden="true"><i data-lucide="printer"></i></span><span class="tw-entry__t">Messe-Plakat</span><span class="sd sd--approved" aria-label="Freigegeben"></span></div></div></div><div class="pv-col"><span class="pv-lbl">Viele Einträge</span><div class="tw-cell" style="width:168px"><span class="tw-cell__date">20</span><div class="tw-entry " title="Geplant"><span class="tw-mono tw-mono--instagram tw-mono--sm" aria-hidden="true">IG</span><span class="tw-entry__t">Story Messe</span><span class="tw-entry__time">8:00</span><span class="sd sd--scheduled" aria-label="Geplant"></span></div><div class="tw-entry " title="Geplant"><span class="tw-mono tw-mono--tiktok tw-mono--sm" aria-hidden="true">TT</span><span class="tw-entry__t">Messe-Reel</span><span class="tw-entry__time">10:00</span><span class="sd sd--scheduled" aria-label="Geplant"></span></div><span class="tw-cell__more">+3 weitere</span></div></div><div class="pv-col"><span class="pv-lbl">Außerhalb des Monats</span><div class="tw-cell is-outside" style="width:168px"><span class="tw-cell__date">1</span></div></div><div class="pv-col"><span class="pv-lbl">Laden</span><div class="tw-cell" style="width:168px"><span class="tw-skel" style="width:24px;height:24px;border-radius:50%"></span><span class="tw-skel" style="height:26px"></span></div></div></div></div>
